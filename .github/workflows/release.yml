name: Release

on:
  push:
    tags: ["v*"]

# Unsigned builds: no signing secrets, no notarization.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-15 # cross-compiled; no Intel runner needed
            target: x86_64-apple-darwin
            bundles: dmg
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - run: pnpm --dir app/ui install --frozen-lockfile
      # tauri::generate_context! reads the built UI (frontendDist).
      - run: pnpm --dir app/ui build
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # tauri-action without `tagName` only builds; the draft release is created in the
      # publish job once every platform has succeeded. The CLI is run with node from
      # `app/` (where beforeBuildCommand paths resolve), so the `tauri` npm script
      # (POSIX `cd ..`) is not used and Windows runners work.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        id: tauri
        with:
          projectPath: app
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist-release
          for f in target/${{ matrix.target }}/release/bundle/*/*; do
            case "$f" in
              *.dmg|*.msi|*.AppImage|*.deb) cp "$f" dist-release/ ;;
            esac
          done
          ls -l dist-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: checksums, provenance, draft release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the draft release
      id-token: write # sigstore signing for attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          path: dist-release
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist-release
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist-release/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist-release/* \
            --repo "$REPO" --draft --verify-tag \
            --title "Sandchart $TAG" \
            --notes "Unsigned builds. Verify with SHA256SUMS and gh attestation verify (see README)."
