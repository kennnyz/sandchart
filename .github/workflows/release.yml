name: Release

on:
  push:
    tags: ["v*"]

# No OS code signing or notarization. The updater bundles are signed with the
# Tauri updater key; its secrets reach only the tauri-action step.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-15 # cross-compiled; no Intel runner needed
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the tag matches the app version
        shell: bash
        run: scripts/check-version.sh "${GITHUB_REF_NAME#v}"
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - run: pnpm --dir app/ui install --frozen-lockfile
      # tauri::generate_context! reads the built UI (frontendDist).
      - run: pnpm --dir app/ui build
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }},wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # The app embeds the built-in indicators, and the author CLI embeds them too.
      - run: cargo build --manifest-path indicators/Cargo.toml --target wasm32-wasip2 --release --locked
      # tauri-action without `tagName` only builds; the draft release is created in the
      # publish job once every platform has succeeded. The CLI is run with node from
      # `app/`, so the `tauri` npm script (POSIX `cd ..`) is not used and Windows
      # runners work. The release overlay (path relative to `app/`) turns on the signed
      # updater bundles and clears beforeBuildCommand, so the signing secrets never reach
      # npm or Vite (the UI is built above); the build fails if the signing key is missing.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        id: tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
      - name: Build the indicator author CLI
        run: cargo build --release --locked -p sandchart-indicator-cli --target ${{ matrix.target }}
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist-release
          bundle=target/${{ matrix.target }}/release/bundle
          for f in "$bundle"/*/*; do
            case "$f" in
              *.dmg|*.deb|*-setup.exe|*-setup.exe.sig|*.AppImage|*.AppImage.sig) cp "$f" dist-release/ ;;
            esac
          done
          # Both macOS jobs produce bundle/macos/Sandchart.app.tar.gz; put the target in the name.
          if [ "${{ runner.os }}" = "macOS" ]; then
            version="${GITHUB_REF_NAME#v}"
            for ext in app.tar.gz app.tar.gz.sig; do
              cp "$bundle/macos/Sandchart.$ext" "dist-release/Sandchart_${version}_${{ matrix.target }}.$ext"
            done
          fi
          # Every platform ships one signed updater bundle.
          if ! compgen -G 'dist-release/*.sig' > /dev/null; then
            echo "no updater signature in $bundle" >&2
            exit 1
          fi
          # The author CLI, one archive per platform.
          root="$PWD"
          bin=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "$bin" && 7z a -tzip "$root/dist-release/sandchart-indicator-${{ matrix.target }}.zip" sandchart-indicator.exe)
          else
            tar -czf "dist-release/sandchart-indicator-${{ matrix.target }}.tar.gz" -C "$bin" sandchart-indicator
          fi
          ls -l dist-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: checksums, provenance, draft release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the draft release
      id-token: write # sigstore signing for attestations
      attestations: write
    steps:
      # For scripts/updater_manifest.py.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          path: dist-release
          merge-multiple: true
      # Before SHA256SUMS, so latest.json is in the sums and the attestation.
      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/updater_manifest.py --dir dist-release --tag "$TAG" --repo "$REPO" \
            --notes "See the release page." --out dist-release/latest.json
      - name: Write SHA256SUMS
        working-directory: dist-release
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist-release/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist-release/* \
            --repo "$REPO" --draft --verify-tag \
            --title "Sandchart $TAG" \
            --notes "Not signed with an OS code-signing certificate; updates are signed with the project key. Verify with SHA256SUMS and gh attestation verify (see README). Version 0.1 cannot update itself: install this version by hand once. On Windows, uninstall 0.1 first (Settings > Apps > Sandchart); your data is kept."
