[package]
name = "sandchart-app"
description = "Sandchart desktop app: Tauri shell over the engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sandchart-core = { path = "../../crates/core" }
sandchart-data = { path = "../../crates/data" }
sandchart-engine = { path = "../../crates/engine" }
sandchart-indicators = { path = "../../crates/indicators" }
directories = "6"
serde.workspace = true
# Already in the tree through Tauri; generate_context! emits serde_json values for `plugins` config.
serde_json = "1"
thiserror.workspace = true
tauri = { version = "2", features = [] }
# Already in the tree through Tauri; used for the sync retry delay.
tokio = { version = "1", features = ["time"] }
