[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/data", "crates/engine", "crates/indicators", "crates/indicator-cli", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/kennnyz/sandchart"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
