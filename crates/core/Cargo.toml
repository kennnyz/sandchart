[package]
name = "sandchart-core"
description = "Core types for Sandchart: instruments, candles, timeframes and tick arithmetic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
# Already in the tree through crates/indicators; the replay file hash.
sha2 = "0.10"
# Already in the tree; reads and writes replay files.
serde_json = "1"
thiserror.workspace = true
# JSON schemas of the wire types for the MCP server's tools; off for everything else.
schemars = { version = "1", optional = true }

[features]
schema = ["dep:schemars"]
