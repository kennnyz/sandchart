[package]
name = "sandchart-data"
description = "Market data providers for Sandchart: the Provider trait and the Binance implementation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
sandchart-core = { path = "../core" }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
wiremock = "0.6"
