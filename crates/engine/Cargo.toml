[package]
name = "sandchart-engine"
description = "Sandchart engine: cache-then-fetch charts, live updates and CSV import over the store and the data providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
sandchart-core = { path = "../core" }
sandchart-store = { path = "../store" }
sandchart-data = { path = "../data" }
sandchart-indicators = { path = "../indicators" }
futures = "0.3"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
time = { version = "0.3", default-features = false, features = ["parsing"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1"
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
