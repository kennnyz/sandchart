[package]
name = "sandchart-mcp"
description = "Sandchart MCP server: charts, indicators, drawings, replays and alerts for AI agents over stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "sandchart-mcp"
path = "src/main.rs"

[dependencies]
sandchart-core = { path = "../core", features = ["schema"] }
sandchart-data = { path = "../data" }
sandchart-engine = { path = "../engine" }
sandchart-indicators = { path = "../indicators" }
# The official MCP SDK; stdio only, no HTTP transport and no chrono.
rmcp = { version = "3.12", default-features = false, features = ["server", "macros", "transport-io"] }
# The same major version rmcp uses for tool input schemas.
schemars = "1"
# Already in the tree through the app; finds the app's data folder.
directories = "6"
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
rmcp = { version = "3.12", default-features = false, features = ["client", "server", "macros", "transport-io"] }
# The same version the store uses; holds the write lock as another process would.
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "time"] }
url = "2"
wiremock = "0.6"
